<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 184" width="640" height="184" role="img"><title>StormyGang Discord Bot</title><desc>A custom Discord bot for the StormyGang community. IN PROGRESS. Release plans undecided.</desc><defs><style>text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
