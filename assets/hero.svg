<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 292" width="640" height="292" role="img"><title>Ali, 3liSY</title><desc>Profile header: the name Ali types, then 3liSY. Coder, creator, explorer. 700K+ subscribers, 250M+ views, Google Maps Local Guide level 6.</desc><defs><style>text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
.bg{fill:#080B10}.pn{fill:#0C1118}.tx{fill:#E6EDF3}.dm{fill:#AEB7C0}
