@keyframes cur{0%,5%{transform:translateX(0);animation-timing-function:steps(3)}14%,30%{transform:translateX(150px);animation-timing-function:steps(3)}36%,38%{transform:translateX(0);animation-timing-function:steps(5)}50%,76%{transform:translateX(250px);animation-timing-function:steps(5)}84%,100%{transform:translateX(0)}}
.spin{transform-origin:520px 100px;animation:spin 14s linear infinite}.spinr{transform-origin:520px 100px;animation:spin 22s linear infinite reverse}
